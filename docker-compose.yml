services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECUR_CHECKPOINT=/app/data/checkpoints/sec_ur_best.pt
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - SECUR_SECRET_KEY=change-this-in-production
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/data/checkpoints
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_storage:
